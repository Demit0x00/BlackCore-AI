name: Publish BlackCore AI release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.1)"
        required: true
        default: "v1.1"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BLACKCORE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLACKCORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLACKCORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLACKCORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured. See README update/release instructions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
      - name: Build signed release APK
        env:
          BLACKCORE_KEYSTORE_PATH: release-keystore.jks
          BLACKCORE_STORE_PASSWORD: ${{ secrets.BLACKCORE_STORE_PASSWORD }}
          BLACKCORE_KEY_ALIAS: ${{ secrets.BLACKCORE_KEY_ALIAS }}
          BLACKCORE_KEY_PASSWORD: ${{ secrets.BLACKCORE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish signed APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          name: BlackCore AI ${{ github.event.inputs.release_tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
